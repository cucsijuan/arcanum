name: CI

on:
  push:
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      # Only the Godot-independent projects; the Godot assembly needs the Godot SDK packages.
      - run: dotnet test tests/Arcanum.Engine.Tests --configuration Release
      - run: dotnet test tests/Arcanum.Data.Tests --configuration Release
